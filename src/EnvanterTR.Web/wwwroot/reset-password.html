<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#10213a">
  <title>Parola yenileme · EnvanterTR</title>
  <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/inter.css">
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#19263b;background:#f4f7fb;font-synthesis:none}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 12% 15%,#e5f0ff 0,transparent 32%),#f4f7fb}.card{width:min(440px,100%);padding:30px;border:1px solid #e1e8f1;border-radius:16px;background:white;box-shadow:0 18px 55px #14284812}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:#17253c;font-size:1rem;font-weight:800;text-decoration:none}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:white;background:linear-gradient(145deg,#3285f3,#145bc6)}em{font-style:normal;color:#f04452}h1{margin:0 0 8px;font-size:1.4rem;letter-spacing:-.04em}p{color:#758299;font-size:.83rem;line-height:1.55}label{display:block;margin:16px 0;color:#526178;font-size:.76rem;font-weight:700}input{width:100%;height:43px;margin-top:6px;padding:0 11px;border:1px solid #dce4ee;border-radius:8px;color:#19263b;background:#fff;font:inherit}button{width:100%;height:42px;margin-top:10px;border:0;border-radius:8px;color:white;background:#1769df;font:inherit;font-size:.78rem;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:19px;margin:12px 0;color:#bd3440;font-size:.75rem}.message.success{color:#16805b}.foot{margin-top:20px;text-align:center;font-size:.76rem}.foot a{color:#1769df;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/"><span class="mark">E</span><span>Envanter<em>TR</em></span></a>
    <h1>Yeni parola belirleyin</h1>
    <p>Hesabınız için yeni ve benzersiz bir parola seçin. Parolanız en az 12 karakter olmalı; büyük ve küçük harf, rakam ve simge içermelidir.</p>
    <form id="resetForm">
      <label>Yeni parola<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
      <label>Yeni parola tekrar<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <button type="submit">Parolayı yenile</button>
    </form>
    <div class="foot"><a href="/">Giriş sayfasına dön</a></div>
  </main>
  <script>
    const parameters = new URLSearchParams(location.hash.slice(1));
    const email = parameters.get('email') || '';
    const token = parameters.get('token') || '';
    history.replaceState(null, '', location.pathname);
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = form.querySelector('button');
    if (!email || !token) { form.hidden = true; message.textContent = 'Parola yenileme bağlantısı eksik veya geçersiz. Giriş ekranından yeni bir bağlantı isteyin.'; }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = new FormData(form);
      const newPassword = String(data.get('password'));
      if (newPassword !== String(data.get('confirmPassword'))) { message.textContent = 'Parolalar eşleşmiyor.'; return; }
      button.disabled = true; message.className = 'message'; message.textContent = 'Bağlantı doğrulanıyor…';
      try {
        const csrfResponse = await fetch('/api/session/csrf', { credentials: 'same-origin' });
        if (!csrfResponse.ok) throw new Error('Parola yenileme hizmetine ulaşılamıyor.');
        const { requestToken } = await csrfResponse.json();
        const response = await fetch('/api/session/password/reset', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': requestToken }, body: JSON.stringify({ email, token, newPassword }) });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || Object.values(result.errors || {}).flat().join(' ') || 'Bağlantı geçersiz veya süresi dolmuş.');
        message.className = 'message success'; message.textContent = result.message; form.reset(); form.hidden = true;
      } catch (error) { message.textContent = error.message || 'İstek tamamlanamadı. Yeni bir bağlantı isteyin.'; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
