name: EnvanterTR CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: envantertr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-security-acceptance:
    name: Linux tenant security acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify forwarded IP boundary with real proxies
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/Verify-ProxyIpBoundary.ps1

      - name: Verify the static UI inventory matches the source
        shell: bash
        run: node tools/Generate-UiInventory.mjs --check

      - name: Verify user interface locale dictionary coverage
        shell: bash
        run: node tools/Verify-UiLocales.mjs

      - name: Verify shared tenant wildcard routing contract
        shell: bash
        run: node tools/Verify-TenantWildcardRouting.mjs

      - name: Verify sidebar navigation destinations and status copy
        shell: bash
        run: node tools/Verify-AppNavigation.mjs

      - name: Prevent browser-native blocking dialogs in application surfaces
        shell: bash
        run: node tools/Verify-NoNativeBrowserDialogs.mjs

      - name: Verify read-only Coolify production readiness diagnostics
        shell: bash
        run: node tools/Verify-CoolifyProductionReadiness.mjs

      - name: Verify keyboard shortcuts and command palette contracts
        shell: bash
        run: node tools/Verify-KeyboardShortcuts.mjs

      - name: Verify asset row context menu and keyboard actions
        shell: bash
        run: node tools/Verify-AssetContextMenu.mjs

      - name: Verify company asset table sizing and row numbering
        shell: bash
        run: node tools/Verify-AssetTableLayout.mjs

      - name: Verify asset row shortcuts
        shell: bash
        run: node tools/Verify-AssetRowActions.mjs
      - name: Verify asset trash UI
        shell: bash
        run: node tools/Verify-AssetTrashUi.mjs

      - name: Verify unlimited Cloud company users
        shell: bash
        run: node tools/Verify-CloudUnlimitedUsers.mjs

      - name: Verify multi-company user invitations
        shell: bash
        run: node tools/Verify-MultiCompanyInvites.mjs

      - name: Verify asset status label editor and option refresh
        shell: bash
        run: node tools/Verify-StatusLabelsUi.mjs

      - name: Verify QR and barcode settings UI contracts
        shell: bash
        run: node tools/Verify-LabelSettingsUi.mjs

      - name: Verify async form references and assignment date rendering
        shell: bash
        run: node tools/Verify-AsyncUiForms.mjs

      - name: Verify reservation decision and cancellation dialogs
        shell: bash
        run: node tools/Verify-ReservationUi.mjs

      - name: Verify activity history filters and shortcuts
        shell: bash
        run: node tools/Verify-ActivityHistoryUi.mjs

      - name: Verify software license assignment revocation dialog
        shell: bash
        run: node tools/Verify-LicenseAssignmentUi.mjs

      - name: Verify software license action confirmation dialog
        shell: bash
        run: node tools/Verify-LicenseActionDialogs.mjs

      - name: Verify software license import profile deletion dialog
        shell: bash
        run: node tools/Verify-LicenseImportProfileUi.mjs

      - name: Verify contract archive and attachment dialogs
        shell: bash
        run: node tools/Verify-ContractActionUi.mjs

      - name: Verify warranty report menu actions
        shell: bash
        run: node tools/Verify-WarrantyReportUi.mjs

      - name: Verify accessory inventory menu actions
        shell: bash
        run: node tools/Verify-AccessoryInventoryUi.mjs

      - name: Verify accessory photo removal dialog
        shell: bash
        run: node tools/Verify-AccessoryPhotoRemovalDialog.mjs

      - name: Verify catalog and custom field dialogs
        shell: bash
        run: node tools/Verify-CatalogAndCustomFieldDialogs.mjs

      - name: Verify directory merge dialogs
        shell: bash
        run: node tools/Verify-DirectoryMergeDialogs.mjs

      - name: Verify accessory catalog quick-entry dialogs
        shell: bash
        run: node tools/Verify-AccessoryCatalogQuickEntry.mjs

      - name: Verify accessory check-in and stock count dialogs
        shell: bash
        run: node tools/Verify-AccessoryCheckinDialog.mjs

      - name: Verify accessory purchase order menu actions
        shell: bash
        run: node tools/Verify-AccessoryOrdersUi.mjs

      - name: Verify consumable inventory menu actions
        shell: bash
        run: node tools/Verify-ConsumableInventoryUi.mjs

      - name: Verify stock request menu actions
        shell: bash
        run: node tools/Verify-InventoryRequestsUi.mjs

      - name: Verify component inventory menu actions
        shell: bash
        run: node tools/Verify-ComponentInventoryUi.mjs

      - name: Verify ready-made kit menu actions
        shell: bash
        run: node tools/Verify-AccessoryKitsUi.mjs

      - name: Verify inventory movement menu actions
        shell: bash
        run: node tools/Verify-InventoryMovementsUi.mjs

      - name: Verify employee records menu actions
        shell: bash
        run: node tools/Verify-EmployeeRecordsUi.mjs

      - name: Verify location catalog and building menu actions
        shell: bash
        run: node tools/Verify-LocationDirectoryUi.mjs

      - name: Verify maintenance attachment menu actions
        shell: bash
        run: node tools/Verify-MaintenanceAttachmentsUi.mjs

      - name: Verify maintenance plan menu actions
        shell: bash
        run: node tools/Verify-MaintenancePlanUi.mjs

      - name: Verify physical audit queue and form actions
        shell: bash
        run: node tools/Verify-AuditScheduleUi.mjs

      - name: Verify prepared reports request ordering and filters
        shell: bash
        run: node tools/Verify-PreparedReportsUi.mjs

      - name: Verify custom asset report session and action flows
        shell: bash
        run: node tools/Verify-CustomAssetReportUi.mjs

      - name: Verify company task menu actions
        shell: bash
        run: node tools/Verify-CompanyTasksUi.mjs

      - name: Verify authentication error and dialog flows
        shell: bash
        run: node tools/Verify-AuthErrorFlows.mjs

      - name: Verify session and API key revocation dialogs
        shell: bash
        run: node tools/Verify-SessionAndTokenDialogs.mjs

      - name: Verify company JSON export download contract
        shell: bash
        run: node tools/Verify-CompanyDataExport.mjs

      - name: Verify dashboard preferences remain drafts until saved
        shell: bash
        run: node tools/Verify-DashboardPreferences.mjs

      - name: Verify asset import preview count and apply gate
        shell: bash
        run: node tools/Verify-AssetImportPreviewUi.mjs

      - name: Verify company data restore UI
        shell: bash
        run: node tools/Verify-DataRestoreUi.mjs

      - name: Verify company app mobile layout
        shell: bash
        run: node tools/Verify-AppMobileLayout.mjs

      - name: Verify Cloud subscription expiry access policy
        shell: bash
        run: node tools/Verify-TenantSubscriptionAccess.mjs

      - name: Verify public demo full-width asset tables
        shell: bash
        run: node tools/Verify-PublicDemoLayout.mjs

      - name: Verify public demo request and platform lead workflow
        shell: bash
        run: node tools/Verify-PlatformDemoRequests.mjs

      - name: Verify platform subscription plan catalog workflow
        shell: bash
        run: node tools/Verify-PlatformPlanManagement.mjs

      - name: Verify hosted Cloud checkout contract
        shell: bash
        run: node tools/Verify-HostedCheckoutUi.mjs

      - name: Verify hosted checkout browser acceptance harness
        shell: bash
        run: node tools/Verify-HostedCheckoutBrowserAcceptance.mjs

      - name: Verify support ticket UI and race guards
        shell: bash
        run: node tools/Verify-SupportUi.mjs

      - name: Verify session response isolation
        shell: bash
        run: node deploy/testing/verify-session-response-isolation.mjs

      - name: Run hosted Cloud checkout in Chromium
        shell: bash
        run: |
          docker build --tag envantertr-hosted-checkout-browser-ci --file deploy/testing/Dockerfile.hosted-checkout-browser .
          docker run --rm --init envantertr-hosted-checkout-browser-ci

      - name: Run five-step company onboarding UI in Chromium
        shell: bash
        run: |
          mkdir -p tests/reports/onboarding-ci
          docker run --rm --init --network none --mount "type=bind,source=$PWD/tests/reports/onboarding-ci,target=/evidence" --entrypoint node envantertr-hosted-checkout-browser-ci /acceptance/company-onboarding.mjs

      - name: Preserve company onboarding UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: company-onboarding-${{ github.sha }}
          path: tests/reports/onboarding-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Run existing company annual checkout with Kestrel PostgreSQL and Chromium
        shell: pwsh
        timeout-minutes: 12
        run: |
          ./deploy/testing/run-existing-checkout-browser-acceptance.ps1 -EvidencePath tests/reports/existing-checkout-ci *>&1 | Tee-Object -FilePath tests/reports/existing-checkout-ci.log
          exit $LASTEXITCODE

      - name: Preserve existing company checkout browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: existing-company-checkout-browser-${{ github.sha }}
          path: |
            tests/reports/existing-checkout-ci.log
            tests/reports/existing-checkout-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify application scripts and camera policy through Nginx
        shell: bash
        run: |
          set -euo pipefail
          docker tag envantertr-hosted-checkout-browser-ci envantertr-hosted-checkout-browser-acceptance:local
          project_name="envantertr-proxy-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose_file="deploy/testing/compose.proxy-acceptance.yaml"
          trap 'docker compose --project-name "$project_name" --file "$compose_file" down --remove-orphans' EXIT
          docker compose --project-name "$project_name" --file "$compose_file" run --rm checks

      - name: Verify payment provider and checkout security contract
        shell: bash
        run: node tools/Verify-IyzipayCheckoutFlow.mjs

      - name: Verify platform company provisioning workflow
        shell: bash
        run: node tools/Verify-PlatformCompanyProvisioning.mjs

      - name: Verify recoverable company deletion and migration artifact
        shell: bash
        run: node tools/Verify-CompanyDeletion.mjs

      - name: Verify platform customer lifecycle workflow
        shell: bash
        run: node tools/Verify-PlatformCustomerLifecycle.mjs

      - name: Verify platform subscription adjustment workflow
        shell: bash
        run: node tools/Verify-PlatformSubscriptionEditor.mjs

      - name: Verify platform admin dashboard experience
        shell: bash
        run: node tools/Verify-PlatformAdminExperience.mjs

      - name: Verify isolated platform MFA browser acceptance harness
        shell: bash
        run: node tools/Verify-PlatformMfaBrowserAcceptance.mjs

      - name: Verify platform member directory and account details
        shell: bash
        run: node tools/Verify-PlatformMemberDirectory.mjs

      - name: Verify platform member invitation workflow
        shell: bash
        run: node tools/Verify-PlatformMemberInvites.mjs

      - name: Verify platform audit search workflow
        shell: bash
        run: node tools/Verify-PlatformAuditSearch.mjs

      - name: Verify platform checkout order directory
        shell: bash
        run: node tools/Verify-PlatformCheckoutOrders.mjs

      - name: Verify Coolify wildcard tenant routing
        shell: bash
        run: node tools/Verify-CoolifyTenantRouting.mjs

      - name: Verify company portal login routing
        shell: bash
        run: node tools/Verify-CompanyPortalLogin.mjs

      - name: Verify SaaS tenant slug profile and session binding
        shell: bash
        run: node tools/Verify-TenantSlugProfile.mjs

      - name: Build Linux application image and verify PostgreSQL native dependency
        shell: bash
        run: |
          set -euo pipefail
          # A private checkout must not leave published files unreadable by APP_UID.
          chmod 600 src/EnvanterTR.Web/wwwroot/vendor/qrcodegen.js
          docker build --tag envantertr-web-ci --file Dockerfile .
          docker run --rm --entrypoint sh envantertr-web-ci -c 'test -r /app/wwwroot/vendor/qrcodegen.js'
          docker run --rm --entrypoint sh envantertr-web-ci -c 'ldconfig -p | grep -q "libgssapi_krb5.so.2"'
          container_id="$(docker create envantertr-web-ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/EnvanterTR.Web.deps.json" "$RUNNER_TEMP/EnvanterTR.Web.deps.json"
          pwsh -NoProfile -File tools/Verify-PublishedDependencies.ps1 \
            -DependencyFile "$RUNNER_TEMP/EnvanterTR.Web.deps.json" \
            -InventoryPath docs/THIRD-PARTY-DEPENDENCIES.csv \
            -Project EnvanterTR.Web
          docker rm "$container_id" >/dev/null
          trap - EXIT

      - name: Verify the built Release image with Production settings
        shell: pwsh
        run: ./deploy/testing/run-release-smoke.ps1 -Image envantertr-web-ci

      - name: Check Linux deployment script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/server/*.sh deploy/local/*.sh deploy/server/tests/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile deploy/local/validate-tar-archive.py

      - name: Test media and key archive validation
        shell: bash
        run: python3 -m unittest discover -s deploy/local/tests -v

      - name: Test Linux backup health decisions
        shell: bash
        run: sudo -n bash deploy/server/tests/backup-health-check.sh

      - name: Validate Linux restore safety ordering
        shell: bash
        run: bash deploy/server/tests/restore-safety-check.sh

      - name: Validate Linux update safety ordering
        shell: bash
        run: bash deploy/server/tests/update-safety-check.sh

      - name: Validate resumable Linux first install
        shell: bash
        run: sudo -n bash deploy/server/tests/install-resume-check.sh

      - name: Verify asset checkout and return workflows
        shell: bash
        run: node tools/Verify-AssetCheckoutReturnUi.mjs

      - name: Verify asset detail actions
        shell: bash
        run: node tools/Verify-AssetDetailActions.mjs

      - name: Verify asset plan quotas
        shell: bash
        run: node tools/Verify-AssetPlanQuota.mjs

      - name: Verify bulk asset action workflows
        shell: bash
        run: node tools/Verify-BulkAssetActions.mjs

      - name: Verify iyzico checkout client contracts
        shell: bash
        run: node tools/Verify-IyzipayCheckoutClient.mjs

      - name: Verify purchase order dialogs
        shell: bash
        run: node tools/Verify-PurchaseOrderDialogs.mjs

      - name: Verify role matrix contracts
        shell: bash
        run: node tools/Verify-RoleMatrix.mjs

      - name: Verify saved asset search workflows
        shell: bash
        run: node tools/Verify-SavedAssetSearchUi.mjs

      - name: Verify stock import dialogs
        shell: bash
        run: node tools/Verify-StockImportDialogs.mjs

      - name: Package the tested Linux server source release
        shell: bash
        run: bash deploy/server/package-release.sh "$RUNNER_TEMP/envantertr-linux-release"

      - name: Preserve the Linux server release package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: envantertr-linux-server-${{ github.sha }}
          path: ${{ runner.temp }}/envantertr-linux-release
          if-no-files-found: error
          retention-days: 14

  linux-postgresql-acceptance:
    name: Linux PostgreSQL tenant acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run isolated PostgreSQL acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          project_name="envantertr-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose_file="deploy/testing/compose.security-acceptance.yaml"
          cleanup() {
            docker compose --project-name "$project_name" --file "$compose_file" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "$project_name" --file "$compose_file" up \
            --build --abort-on-container-exit --exit-code-from acceptance

  windows-deployment-safety:
    name: Windows deployment and backup safety
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the local account recovery utility
        shell: pwsh
        run: dotnet publish tools/EnvanterTR.AccountRecovery/EnvanterTR.AccountRecovery.csproj -c Release -o "$env:RUNNER_TEMP\envantertr-account-recovery"

      - name: Verify deterministic dependency metadata across platforms
        shell: pwsh
        run: ./tools/tests/third-party-inventory-determinism.ps1

      - name: Rebuild the third-party dependency inventory
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'third-party-packages'
          dotnet restore tests/EnvanterTR.SecurityAcceptance/EnvanterTR.SecurityAcceptance.csproj --packages $packages
          dotnet restore tools/EnvanterTR.Backup/EnvanterTR.Backup.csproj --packages $packages
          ./tools/Generate-ThirdPartyInventory.ps1 -NuGetPackagesPath $packages
          git diff --exit-code -- docs/THIRD-PARTY-DEPENDENCIES.csv

      - name: Build the self-contained Windows x64 package
        shell: pwsh
        run: ./deploy/windows/publish.ps1 -OutputPath "$env:RUNNER_TEMP\envantertr-windows-publish"

      - name: Match Windows published dependencies to the license inventory
        shell: pwsh
        run: ./tools/Verify-PublishedDependencies.ps1 -DependencyFile "src/EnvanterTR.Web/bin/Release/net10.0/win-x64/EnvanterTR.Web.deps.json" -InventoryPath docs/THIRD-PARTY-DEPENDENCIES.csv -Project EnvanterTR.Web

      - name: Run the published app with a DPAPI database secret
        shell: pwsh
        run: ./deploy/windows/tests/windows-app-dpapi-startup-check.ps1 -PackagePath "$env:RUNNER_TEMP\envantertr-windows-publish"

      - name: Validate Windows backup encryption and tamper rejection
        shell: pwsh
        run: ./deploy/windows/tests/backup-crypto-check.ps1

      - name: Validate local Windows backup ACLs
        shell: pwsh
        run: ./deploy/local/tests/private-acl-check.ps1

      - name: Validate backup alert handling
        shell: pwsh
        run: ./deploy/windows/tests/backup-alert-check.ps1

      - name: Validate restore safety ordering
        shell: pwsh
        run: ./deploy/windows/tests/restore-safety-check.ps1

      - name: Validate update safety ordering
        shell: pwsh
        run: ./deploy/windows/tests/update-safety-check.ps1

      - name: Validate Windows installer rollback and readiness
        shell: pwsh
        run: ./deploy/windows/tests/install-safety-check.ps1

      - name: Validate Windows Docker SDK mount paths
        shell: pwsh
        run: ./deploy/windows/tests/publish-path-check.ps1

      - name: Validate Windows DPAPI database secret storage
        shell: pwsh
        run: ./deploy/windows/tests/windows-secrets-check.ps1

      - name: Validate legacy Windows secret migration rollback
        shell: pwsh
        run: ./deploy/windows/tests/protect-connection-string-safety-check.ps1

      - name: Validate Windows SMTP secret configuration safety
        shell: pwsh
        run: ./deploy/windows/tests/configure-email-safety-check.ps1

      - name: Validate Windows release ZIP and SHA-256
        shell: pwsh
        run: ./deploy/windows/tests/package-release-check.ps1

      - name: Package Windows release and verify SHA-256
        shell: pwsh
        run: ./deploy/windows/package-release.ps1 -PackagePath "$env:RUNNER_TEMP\envantertr-windows-publish" -OutputDirectory "$env:RUNNER_TEMP\envantertr-windows-release" -Commit "$env:GITHUB_SHA"

      - name: Verify distributable Windows release files
        shell: pwsh
        run: ./deploy/windows/verify-release.ps1 -ArchivePath "$env:RUNNER_TEMP\envantertr-windows-release\envantertr-windows-x64-$($env:GITHUB_SHA.Substring(0,12)).zip"

      - name: Preserve the verified Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: envantertr-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/envantertr-windows-release
          if-no-files-found: error
          retention-days: 14
