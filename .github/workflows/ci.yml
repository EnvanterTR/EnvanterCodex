name: EnvanterTR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: envantertr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-security-acceptance:
    name: Linux tenant security acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify user interface locale dictionary coverage
        shell: bash
        run: node tools/Verify-UiLocales.mjs

      - name: Run isolated PostgreSQL acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          project_name="envantertr-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose_file="deploy/testing/compose.security-acceptance.yaml"
          cleanup() {
            docker compose --project-name "$project_name" --file "$compose_file" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "$project_name" --file "$compose_file" up \
            --build --abort-on-container-exit --exit-code-from acceptance

      - name: Build Linux application image and verify PostgreSQL native dependency
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag envantertr-web-ci --file Dockerfile .
          docker run --rm --entrypoint sh envantertr-web-ci -c 'ldconfig -p | grep -q "libgssapi_krb5.so.2"'
          container_id="$(docker create envantertr-web-ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/EnvanterTR.Web.deps.json" "$RUNNER_TEMP/EnvanterTR.Web.deps.json"
          pwsh -NoProfile -File tools/Verify-PublishedDependencies.ps1 \
            -DependencyFile "$RUNNER_TEMP/EnvanterTR.Web.deps.json" \
            -InventoryPath docs/THIRD-PARTY-DEPENDENCIES.csv \
            -Project EnvanterTR.Web
          docker rm "$container_id" >/dev/null
          trap - EXIT

      - name: Check Linux deployment script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/server/*.sh deploy/local/*.sh deploy/server/tests/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile deploy/local/validate-tar-archive.py

      - name: Test media and key archive validation
        shell: bash
        run: python3 -m unittest discover -s deploy/local/tests -v

      - name: Test Linux backup health decisions
        shell: bash
        run: sudo -n bash deploy/server/tests/backup-health-check.sh

      - name: Validate Linux restore safety ordering
        shell: bash
        run: bash deploy/server/tests/restore-safety-check.sh

      - name: Validate Linux update safety ordering
        shell: bash
        run: bash deploy/server/tests/update-safety-check.sh

      - name: Validate resumable Linux first install
        shell: bash
        run: sudo -n bash deploy/server/tests/install-resume-check.sh

      - name: Package the tested Linux server source release
        shell: bash
        run: bash deploy/server/package-release.sh "$RUNNER_TEMP/envantertr-linux-release"

      - name: Preserve the Linux server release package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: envantertr-linux-server-${{ github.sha }}
          path: ${{ runner.temp }}/envantertr-linux-release
          if-no-files-found: error
          retention-days: 14

  windows-deployment-safety:
    name: Windows deployment and backup safety
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the local account recovery utility
        shell: pwsh
        run: dotnet publish tools/EnvanterTR.AccountRecovery/EnvanterTR.AccountRecovery.csproj -c Release -o "$env:RUNNER_TEMP\envantertr-account-recovery"

      - name: Rebuild the third-party dependency inventory
        shell: pwsh
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'third-party-packages'
          dotnet restore tests/EnvanterTR.SecurityAcceptance/EnvanterTR.SecurityAcceptance.csproj --packages $packages
          dotnet restore tools/EnvanterTR.Backup/EnvanterTR.Backup.csproj --packages $packages
          ./tools/Generate-ThirdPartyInventory.ps1 -NuGetPackagesPath $packages
          git diff --exit-code -- docs/THIRD-PARTY-DEPENDENCIES.csv

      - name: Build the self-contained Windows x64 package
        shell: pwsh
        run: ./deploy/windows/publish.ps1 -OutputPath "$env:RUNNER_TEMP\envantertr-windows-publish"

      - name: Match Windows published dependencies to the license inventory
        shell: pwsh
        run: ./tools/Verify-PublishedDependencies.ps1 -DependencyFile "src/EnvanterTR.Web/bin/Release/net10.0/win-x64/EnvanterTR.Web.deps.json" -InventoryPath docs/THIRD-PARTY-DEPENDENCIES.csv -Project EnvanterTR.Web

      - name: Run the published app with a DPAPI database secret
        shell: pwsh
        run: ./deploy/windows/tests/windows-app-dpapi-startup-check.ps1 -PackagePath "$env:RUNNER_TEMP\envantertr-windows-publish"

      - name: Validate Windows backup encryption and tamper rejection
        shell: pwsh
        run: ./deploy/windows/tests/backup-crypto-check.ps1

      - name: Validate local Windows backup ACLs
        shell: pwsh
        run: ./deploy/local/tests/private-acl-check.ps1

      - name: Validate backup alert handling
        shell: pwsh
        run: ./deploy/windows/tests/backup-alert-check.ps1

      - name: Validate restore safety ordering
        shell: pwsh
        run: ./deploy/windows/tests/restore-safety-check.ps1

      - name: Validate update safety ordering
        shell: pwsh
        run: ./deploy/windows/tests/update-safety-check.ps1

      - name: Validate Windows installer rollback and readiness
        shell: pwsh
        run: ./deploy/windows/tests/install-safety-check.ps1

      - name: Validate Windows Docker SDK mount paths
        shell: pwsh
        run: ./deploy/windows/tests/publish-path-check.ps1

      - name: Validate Windows DPAPI database secret storage
        shell: pwsh
        run: ./deploy/windows/tests/windows-secrets-check.ps1

      - name: Validate legacy Windows secret migration rollback
        shell: pwsh
        run: ./deploy/windows/tests/protect-connection-string-safety-check.ps1

      - name: Validate Windows SMTP secret configuration safety
        shell: pwsh
        run: ./deploy/windows/tests/configure-email-safety-check.ps1

      - name: Validate Windows release ZIP and SHA-256
        shell: pwsh
        run: ./deploy/windows/tests/package-release-check.ps1

      - name: Package Windows release and verify SHA-256
        shell: pwsh
        run: ./deploy/windows/package-release.ps1 -PackagePath "$env:RUNNER_TEMP\envantertr-windows-publish" -OutputDirectory "$env:RUNNER_TEMP\envantertr-windows-release" -Commit "$env:GITHUB_SHA"

      - name: Verify distributable Windows release files
        shell: pwsh
        run: ./deploy/windows/verify-release.ps1 -ArchivePath "$env:RUNNER_TEMP\envantertr-windows-release\envantertr-windows-x64-$($env:GITHUB_SHA.Substring(0,12)).zip"

      - name: Preserve the verified Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: envantertr-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/envantertr-windows-release
          if-no-files-found: error
          retention-days: 14
