name: EnvanterTR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: envantertr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-security-acceptance:
    name: Linux tenant security acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run isolated PostgreSQL acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          project_name="envantertr-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose_file="deploy/testing/compose.security-acceptance.yaml"
          cleanup() {
            docker compose --project-name "$project_name" --file "$compose_file" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "$project_name" --file "$compose_file" up \
            --build --abort-on-container-exit --exit-code-from acceptance

      - name: Check Linux deployment script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/server/*.sh deploy/local/*.sh deploy/server/tests/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile deploy/local/validate-tar-archive.py

      - name: Test media and key archive validation
        shell: bash
        run: python3 -m unittest discover -s deploy/local/tests -v

      - name: Test Linux backup health decisions
        shell: bash
        run: sudo -n bash deploy/server/tests/backup-health-check.sh

      - name: Validate Linux restore safety ordering
        shell: bash
        run: bash deploy/server/tests/restore-safety-check.sh

      - name: Validate Linux update safety ordering
        shell: bash
        run: bash deploy/server/tests/update-safety-check.sh

      - name: Validate resumable Linux first install
        shell: bash
        run: sudo -n bash deploy/server/tests/install-resume-check.sh

      - name: Package the tested Linux server source release
        shell: bash
        run: bash deploy/server/package-release.sh "$RUNNER_TEMP/envantertr-linux-release"

      - name: Preserve the Linux server release package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: envantertr-linux-server-${{ github.sha }}
          path: ${{ runner.temp }}/envantertr-linux-release
          if-no-files-found: error
          retention-days: 14

  windows-deployment-safety:
    name: Windows deployment and backup safety
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the self-contained Windows x64 package
        shell: pwsh
        run: ./deploy/windows/publish.ps1 -OutputPath "$env:RUNNER_TEMP\envantertr-windows-publish"

      - name: Run the published app with a DPAPI database secret
        shell: pwsh
        run: ./deploy/windows/tests/windows-app-dpapi-startup-check.ps1 -PackagePath "$env:RUNNER_TEMP\envantertr-windows-publish"

      - name: Validate Windows backup encryption and tamper rejection
        shell: pwsh
        run: ./deploy/windows/tests/backup-crypto-check.ps1

      - name: Validate local Windows backup ACLs
        shell: pwsh
        run: ./deploy/local/tests/private-acl-check.ps1

      - name: Validate backup alert handling
        shell: pwsh
        run: ./deploy/windows/tests/backup-alert-check.ps1

      - name: Validate restore safety ordering
        shell: pwsh
        run: ./deploy/windows/tests/restore-safety-check.ps1

      - name: Validate update safety ordering
        shell: pwsh
        run: ./deploy/windows/tests/update-safety-check.ps1

      - name: Validate Windows installer rollback and readiness
        shell: pwsh
        run: ./deploy/windows/tests/install-safety-check.ps1

      - name: Validate Windows DPAPI database secret storage
        shell: pwsh
        run: ./deploy/windows/tests/windows-secrets-check.ps1

      - name: Validate legacy Windows secret migration rollback
        shell: pwsh
        run: ./deploy/windows/tests/protect-connection-string-safety-check.ps1

      - name: Preserve the verified Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: envantertr-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/envantertr-windows-publish
          if-no-files-found: error
          retention-days: 14
