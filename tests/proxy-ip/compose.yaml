services:
  edge:
    image: traefik:v3.6
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/routes.yaml
    ports: ["127.0.0.1::8080"]
    volumes: ["./routes.yaml:/etc/traefik/routes.yaml:ro"]
  ingress:
    image: nginx:alpine
    volumes: ["./ingress.conf:/etc/nginx/conf.d/default.conf:ro"]
  observer:
    image: nginx:alpine
    volumes: ["./observer.conf:/etc/nginx/conf.d/default.conf:ro"]
