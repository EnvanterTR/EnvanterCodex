name: envantertr-coolify

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: envantertr
      POSTGRES_USER: envantertr
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ForwardedHeaders__Enabled: "true"
      ClientIp__TrustedProxyNetworks: ${CLIENT_IP_TRUSTED_PROXY_NETWORKS:-}
      ClientIp__UseCloudflareConnectingIp: ${CLIENT_IP_USE_CLOUDFLARE_CONNECTING_IP:-false}
      TenantRouting__RootDomain: envantertr.com
      TenantRouting__CookieDomain: .envantertr.com
      DataProtection__KeysPath: /var/lib/envantertr/data-protection-keys
      ConnectionStrings__EnvanterTR: "Host=database;Port=5432;Database=envantertr;Username=envantertr;Password=${SERVICE_PASSWORD_64_POSTGRES}"
      Setup__BootstrapToken: ${SERVICE_PASSWORD_64_SETUP}
      Setup__PlatformBootstrapToken: ${SETUP_PLATFORM_BOOTSTRAP_TOKEN:-}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__EnableSsl: ${EMAIL_SMTP_ENABLE_SSL:-true}
      Email__Smtp__Username: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-EnvanterTR}
      Email__PublicBaseUrl: ${EMAIL_PUBLIC_BASE_URL:-}
      Platform__CrmFollowUpEmailRemindersEnabled: ${PLATFORM_CRM_FOLLOW_UP_EMAIL_REMINDERS_ENABLED:-false}
      Iyzipay__ApiKey: ${IYZIPAY_API_KEY:-}
      Iyzipay__SecretKey: ${IYZIPAY_SECRET_KEY:-}
      Iyzipay__BaseUrl: ${IYZIPAY_BASE_URL:-https://sandbox-api.iyzipay.com}
      Iyzipay__CallbackUrl: ${IYZIPAY_CALLBACK_URL:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - company_media_data:/var/lib/envantertr/company-media
      - data_protection_keys_data:/var/lib/envantertr/data-protection-keys
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  public-site:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.public-site
    restart: unless-stopped
    depends_on: [web]
    # One shared tenant route; future companies do not need per-host proxy edits.
    # Go regexp \z anchors the host without Docker/Coolify dollar interpolation.
    # Configure the envantertr-dns ACME resolver on the existing proxy first.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.envantertr-tenants-http.entrypoints=http'
      - 'traefik.http.routers.envantertr-tenants-http.rule=HostRegexp(`^[a-z0-9-]+[.]envantertr[.]com\z`)'
      - 'traefik.http.routers.envantertr-tenants-http.priority=20'
      - 'traefik.http.routers.envantertr-tenants-http.service=envantertr-tenants'
      - 'traefik.http.routers.envantertr-tenants-http.middlewares=envantertr-tenant-https'
      - 'traefik.http.middlewares.envantertr-tenant-https.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.envantertr-tenant-https.redirectscheme.permanent=true'
      - 'traefik.http.routers.envantertr-tenants-https.entrypoints=https'
      - 'traefik.http.routers.envantertr-tenants-https.rule=HostRegexp(`^[a-z0-9-]+[.]envantertr[.]com\z`)'
      - 'traefik.http.routers.envantertr-tenants-https.priority=20'
      - 'traefik.http.routers.envantertr-tenants-https.service=envantertr-tenants'
      - 'traefik.http.routers.envantertr-tenants-https.tls=true'
      - 'traefik.http.routers.envantertr-tenants-https.tls.certresolver=envantertr-dns'
      - 'traefik.http.routers.envantertr-tenants-https.tls.domains[0].main=envantertr.com'
      - 'traefik.http.routers.envantertr-tenants-https.tls.domains[0].sans=*.envantertr.com'
      - 'traefik.http.services.envantertr-tenants.loadbalancer.server.port=80'
    networks: [internal]

networks:
  internal: {}

volumes:
  database_data:
    name: envantertr-v1-postgres-data
  company_media_data:
    name: envantertr-v1-company-media
  data_protection_keys_data:
    name: envantertr-v1-data-protection-keys
