server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    location = /giris {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:8080/;
    }

    location = /setup.html { proxy_pass http://web:8080/setup.html; }
    location = /platform-setup.html { proxy_pass http://web:8080/platform-setup.html; }
    location = /platform-admin.html { proxy_pass http://web:8080/platform-admin.html; }
    location = /reset-password.html { proxy_pass http://web:8080/reset-password.html; }
    location = /api { proxy_pass http://web:8080/api; }

    location = /api/company/branding/logo {
        client_max_body_size 2162688;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:8080/api/company/branding/logo;
    }

    location = /api/company/import/preview {
        client_max_body_size 32m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:8080/api/company/import/preview;
    }

    location ~ "^/api/assets/[0-9a-fA-F-]{36}/attachments$" {
        client_max_body_size 10616832;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:8080;
    }

    # Upload limits are enforced again by each API endpoint. The proxy must
    # allow the largest supported CSV preview and bounded media uploads through.
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://web:8080/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
