services:
  web:
    image: nginx:alpine
    volumes:
      - ../../src/EnvanterTR.Web/wwwroot:/app:ro
      - ./proxy-web-stub.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [acceptance]
  production:
    image: nginx:alpine
    depends_on: [web]
    volumes:
      - ../../src/EnvanterTR.PublicSite:/usr/share/nginx/html:ro
      - ../coolify/nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [acceptance]
  local:
    image: nginx:alpine
    depends_on: [web]
    volumes:
      - ../../src/EnvanterTR.PublicSite:/usr/share/nginx/html:ro
      - ../local/nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [acceptance]
  checks:
    image: envantertr-hosted-checkout-browser-acceptance:local
    depends_on: [production, local]
    entrypoint: [node, /proxy-acceptance.mjs]
    volumes:
      - ./proxy-acceptance.mjs:/proxy-acceptance.mjs:ro
    networks: [acceptance]
networks:
  acceptance:
    internal: true
