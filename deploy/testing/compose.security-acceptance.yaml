services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: envantertr_security_acceptance
      POSTGRES_USER: envantertr_test
      POSTGRES_PASSWORD: security-acceptance-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [acceptance]

  acceptance:
    build:
      context: ../..
      dockerfile: deploy/testing/Dockerfile.security-acceptance
    depends_on:
      database:
        condition: service_healthy
    environment:
      ENVANTERTR_SECURITY_TEST_CONNECTION: "Host=database;Port=5432;Database=envantertr_security_acceptance;Username=envantertr_test;Password=security-acceptance-only"
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    networks: [acceptance]

networks:
  acceptance:
    internal: true
